---
apiVersion: v1
kind: Namespace
metadata:
  name: front-oss-mehdi
  labels:
    app: osssite-front
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osssite-front
  namespace: front-oss-mehdi
  labels:
    app: osssite-front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: osssite-front
  template:
    metadata:
      labels:
        app: osssite-front
    spec:
      containers:
        - name: web
          image: mehdino123/osssite-front:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: osssite-front
  namespace: front-oss-mehdi
  labels:
    app: osssite-front
spec:
  type: LoadBalancer
  selector:
    app: osssite-front
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
