apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: oss-site
data:
  # ── Database ──
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_USER: "appuser"
  DB_NAME: "appdb"

  # ── Public Turnstile configuration ──
  TURNSTILE_SITE_KEY: "0x4AAAAAAEEZs14kAL9OcKpf"

  # ── Public OSS assistant ──
  OPENROUTER_MODEL: "qwen/qwen3-235b-a22b-2507"
  OPENROUTER_EMBEDDING_MODEL: "qwen/qwen3-embedding-8b"
  RESOURCE_RETRIEVAL_MAX_DISTANCE: "0.65"

  # ── Runtime ──
  NODE_ENV: "production"
  COOKIE_SECURE: "false"
  COOKIE_DOMAIN: ""
  CSRF_ORIGIN: ""
  ALLOWED_ORIGINS: ""
  TRUST_PROXY: "true"
