---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: back-pvc
  namespace: oss
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: oss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: oss-back:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: back-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: oss
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
