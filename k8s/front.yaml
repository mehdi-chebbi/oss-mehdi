---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: oss-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: front
          image: mehdino123/oss-site-front:latest1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: oss-site
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.2.32
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 80
