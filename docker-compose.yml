services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        # Vite reads this at build time → bakes site key into the JS bundle.
        # Site keys are public by design (visible in browser anyway).
        VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAEEZs14kAL9OcKpf"
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: appsecret
      DB_NAME: appdb
      # ── Secrets (hardcoded) ──
      # Generated with: openssl rand -hex 32
      JWT_SECRET: "fcab09c8bb83dd1316c2bafb62f109b61d1b5bb6d42fb6603ad9bd92349ed686"
      JWT_REFRESH_SECRET: "a2577104ac8c96f70d75a43a892a32168bbbf1c7af169f6024614bcead283056"
      TURNSTILE_SITE_KEY: "0x4AAAAAAEEZs14kAL9OcKpf"
      TURNSTILE_SECRET: "0x4AAAAAAEEZsxwtfxZ4mKs34QnoJ-quvIc"
      # ── Runtime config ──
      NODE_ENV: production
      COOKIE_SECURE: "false"   # HTTP locally — browsers reject Secure cookies over http://
      COOKIE_DOMAIN: ""
      CSRF_ORIGIN: "http://localhost:3000"
      ALLOWED_ORIGINS: "http://localhost:3000"
      # Backend is behind nginx in docker → trust proxy so req.ip is real client IP
      TRUST_PROXY: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
